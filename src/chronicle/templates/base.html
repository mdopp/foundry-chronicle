<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block titel %}Foundry Chronicle{% endblock %}</title>
    <style>
      /* ServiceBay-Design-Standard: :root ist dunkel, hell überschreibt. */
      :root {
        color-scheme: dark light;

        --background: #050505;
        --surface: #111114;
        --surface-2: #1c1c20;
        --surface-muted: #0a0a0c;
        --border: #2a2a30;
        --border-strong: #3a3a42;
        --text: #f0f0f0;
        --text-muted: #a1a1aa;
        --text-subtle: #6b7280;

        --status-ok: #34d399;
        --status-warn: #fbbf24;
        --status-fail: #f87171;
        --status-info: #60a5fa;

        --accent: #3b82f6;
        --accent-strong: #2563eb;
        --on-accent: #ffffff;

        --font-sans: "Geist", "Inter", "Outfit", system-ui, sans-serif;
        --font-mono: "Geist Mono", "Fira Code", ui-monospace, monospace;

        --r-chip: .375rem;
        --r-card: .625rem;
        --r-panel: .875rem;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --space-8: 64px;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --background: #f8fafc;
          --surface: #ffffff;
          --surface-2: #f1f5f9;
          --surface-muted: #f8fafc;
          --border: #e2e8f0;
          --border-strong: #cbd5e1;
          --text: #0f172a;
          --text-muted: #475569;
          --text-subtle: #94a3b8;

          --status-ok: #059669;
          --status-warn: #d97706;
          --status-fail: #dc2626;
          --status-info: #2563eb;
        }
      }

      * { box-sizing: border-box; }

      body {
        background: var(--background);
        color: var(--text);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
        margin: 0;
      }

      .huelle {
        margin: 0 auto;
        max-width: 46rem;
        padding: var(--space-5) var(--space-4);
        padding-bottom: max(var(--space-7), env(safe-area-inset-bottom));
      }

      .kopf {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
        justify-content: space-between;
        margin-bottom: var(--space-5);
      }

      h1 { font-size: 1.5rem; letter-spacing: -.01em; margin: 0; }
      h2 { font-size: 1.125rem; margin: 0 0 var(--space-3); }
      h3 { font-size: 1rem; margin: 0 0 var(--space-2); }
      p { margin: 0 0 var(--space-3); }
      p:last-child { margin-bottom: 0; }
      a { color: var(--accent); }

      .leitsatz { color: var(--text-muted); font-size: .875rem; margin: var(--space-1) 0 0; }
      .gedaempft { color: var(--text-muted); font-size: .875rem; }

      .karte {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-panel);
        margin-bottom: var(--space-4);
        padding: var(--space-5);
      }

      label { color: var(--text-muted); display: block; font-size: .875rem; margin-bottom: var(--space-1); }

      /* 1rem verhindert, dass iOS beim Fokus in ein Feld hineinzoomt. */
      input, select {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--r-card);
        color: var(--text);
        font-family: inherit;
        font-size: 1rem;
        padding: var(--space-3);
        width: 100%;
      }
      input, select { min-height: 44px; }
      input::placeholder { color: var(--text-subtle); }
      input:focus, select:focus { border-color: var(--border-strong); }

      button {
        background: var(--accent);
        border: 0;
        border-radius: var(--r-card);
        color: var(--on-accent);
        cursor: pointer;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        min-height: 44px;
        padding: 0 var(--space-5);
        transition: background 300ms cubic-bezier(.16, 1, .3, 1);
      }
      button:hover { background: var(--accent-strong); }
      button.leise { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
      button.leise:hover { background: var(--surface-2); }

      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .feld { margin-bottom: var(--space-4); }
      .feld:last-child { margin-bottom: 0; }
      .feld p { margin: var(--space-1) 0 0; }

      .absenden { margin-top: var(--space-3); }

      summary { color: var(--text-muted); cursor: pointer; font-size: .875rem; }
      details > *:not(summary) { margin-top: var(--space-2); }

      dl { display: grid; gap: var(--space-2) var(--space-4); grid-template-columns: max-content 1fr; margin: 0; }
      dt { color: var(--text-muted); }
      dd { margin: 0; }

      .fehlt { color: var(--status-fail); }
      .steht { color: var(--status-ok); }
      .hinweis { color: var(--status-info); }

      code {
        background: var(--surface-muted);
        border-radius: var(--r-chip);
        font-family: var(--font-mono);
        font-size: .875em;
        overflow-wrap: anywhere;
        padding: 0 var(--space-1);
      }

      @media (max-width: 30rem) {
        .karte { padding: var(--space-4); }
        dl { grid-template-columns: 1fr; gap: var(--space-1); }
        dd { margin-bottom: var(--space-2); }
      }
    </style>
  </head>
  <body>
    <div class="huelle">
      <header class="kopf">
        <div>
          <h1>Foundry Chronicle</h1>
          <p class="leitsatz">Betrieb dieser Box — gespielt wird in Discord.</p>
        </div>
      </header>
      <main>{% block inhalt %}{% endblock %}</main>
    </div>
  </body>
</html>
