[project]
name = "foundry-chronicle"
version = "0.1.0"
description = "Sitzungsprotokolle für Tisch-Rollenspiel — eine Instanz pro Gruppe"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "markupsafe>=2.1",
    "requests>=2.31",
    "python-socketio[client]>=5.11",
]

[project.optional-dependencies]
# waitress statt gunicorn: reines Python ohne C-Erweiterung — kein Build-Werkzeug im Image —
# und ein Prozess mit Threads, also genau ein SQLite-Schreiber.
server = ["waitress>=3.0"]
# Eigenes Extra, weil faster-whisper mit ctranslate2 und onnxruntime dreistellige
# Megabyte zieht: das Image bringt es mit, eine Dev-Installation und die CI bleiben
# schlank. Die Tests setzen ein erfundenes Modell ein und laden nichts herunter.
transcribe = ["faster-whisper>=1.0"]
# Eigenes Extra für den Aufnahme-Bot: py-cord ist ein Gateway-Client und zieht PyNaCl
# nach, das weder der Webdienst noch der nächtliche Stapel braucht. Audio zu empfangen
# ist von Discord nicht offiziell unterstützt — die Bruchstelle bleibt damit auf ein
# Extra und eine Datei begrenzt. py-cord belegt das Paket ``discord``; ein daneben
# installiertes discord.py schlägt sich mit ihm.
discord = ["py-cord>=2.6", "PyNaCl>=1.5"]
dev =["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronicle = ["schema.sql", "templates/*.html"]

[tool.ruff]
line-length = 100
# Der Autoloop-Skill ist eingespielte Fremdmechanik, keine Projektquelle.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/chronicle", "scripts"]
relative_files = true
# Ohne Thread-Coverage zeigt Worker-Code eine falsch-niedrige Zahl (ServiceBay-Standard).
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
