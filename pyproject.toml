[project]
name = "foundry-chronicle"
version = "0.1.0"
description = "Sitzungsprotokolle für Tisch-Rollenspiel — eine Instanz pro Gruppe"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "markupsafe>=2.1",
    "requests>=2.31",
    "python-socketio[client]>=5.11",
]

[project.optional-dependencies]
# waitress statt gunicorn: reines Python ohne C-Erweiterung — kein Build-Werkzeug im Image —
# und ein Prozess mit Threads, also genau ein SQLite-Schreiber.
server = ["waitress>=3.0"]
# Eigenes Extra, weil faster-whisper mit ctranslate2 und onnxruntime dreistellige
# Megabyte zieht: das Image bringt es mit, eine Dev-Installation und die CI bleiben
# schlank. Die Tests setzen ein erfundenes Modell ein und laden nichts herunter.
# >=1.1, weil erst dort ``large-v3-turbo`` aufgelöst wird — das Modell, das auf einer
# vorhandenen Karte läuft (#84). Ohne Karte ändert die Fassung nichts.
transcribe = ["faster-whisper>=1.1"]
# Eigenes Extra für den Aufnahme-Bot: py-cord ist ein Gateway-Client mit Sprach-Anhang,
# den weder der Webdienst noch der nächtliche Stapel braucht. Audio zu empfangen ist von
# Discord nicht offiziell unterstützt — die Bruchstelle bleibt damit auf ein Extra und
# eine Datei begrenzt. py-cord belegt das Paket ``discord``; ein daneben installiertes
# discord.py schlägt sich mit ihm.
#
# **``davey`` fehlt hier mit Absicht — und das ist die Bedingung dafür, dass der Bot
# überhaupt etwas hört.** py-cord meldet Discord als höchste unterstützte Fassung von
# DAVE das, was ``davey`` mitbringt, sonst **0**. Mit davey wird DAVE ausgehandelt, der
# Ton kommt Ende-zu-Ende verschlüsselt an — und py-cord dekodiert in ``opus.py`` **erst**
# Opus und entschlüsselt **danach**. Der Dekoder sieht also Rauschen und wirft »corrupted
# stream«; der Empfänger stirbt, die Sitzung bekommt keine Spur. Genau so am 2026-08-11
# erlebt. Ohne davey melden wir 0, Discord stuft den Kanal auf die reine
# Transportverschlüsselung herunter, und die kann py-cord mit PyNaCl lesen.
#
# Ohne davey schreibt py-cord eine Warnzeile (»voice will NOT be supported«) — sie ist
# irreführend: abgeschaltet wird nichts, siehe ``utils.warn_if_voice_dependencies_missing``.
# Wirklich nötig ist **PyNaCl**, und das holt ``[voice]``.
#
# **Wenn Discord DAVE eines Tages erzwingt, hört der Bot auf zu hören.** Dann hilft nur
# eine py-cord-Fassung, die vor dem Dekodieren entschlüsselt — Pycord-Issue #3139.
# Ohne ``[voice]``, weil dieses Extra ``davey`` mitzieht. PyNaCl steht deshalb hier
# selbst, mit py-cords eigener Schranke.
discord = ["py-cord>=2.8.1", "PyNaCl>=1.6.2,<1.7"]
# py-cord gehört hier dazu, obwohl nur der Bot es braucht: der Regressionstest
# registriert unsere Senke gegen py-cords **echten** Empfangs-Router. Genau das haben die
# Attrappen nicht gesehen — zweimal hintereinander fiel erst auf der Box auf, dass wir
# das Protokoll der Bibliothek verfehlt hatten. Es ist reines Python plus zwei kleine
# Räder; die CI wird davon nicht schwer.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pyyaml>=6.0",
    "py-cord>=2.8.1",
    "PyNaCl>=1.6.2,<1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronicle = ["schema.sql", "suchindex.sql", "templates/*.html"]
# Die eingebaute Testwelt gehört ins Image: ohne sie fiele die Quelle »Testwelt« auf der
# Box auf eine fehlende Datei zurück, obwohl die Oberfläche sie anbietet.
"chronicle.foundry" = ["testwelt.json"]

[tool.ruff]
line-length = 100
# Der Autoloop-Skill ist eingespielte Fremdmechanik, keine Projektquelle.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/chronicle", "scripts"]
relative_files = true
# Ohne Thread-Coverage zeigt Worker-Code eine falsch-niedrige Zahl (ServiceBay-Standard).
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
