[project]
name = "foundry-chronicle"
version = "0.1.0"
description = "Sitzungsprotokolle für Tisch-Rollenspiel — eine Instanz pro Gruppe"
requires-python = ">=3.12"
dependencies = ["flask>=3.0", "requests>=2.31", "python-socketio[client]>=5.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronicle = ["schema.sql", "templates/*.html"]

[tool.ruff]
line-length = 100
# Der Autoloop-Skill ist eingespielte Fremdmechanik, keine Projektquelle.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/chronicle", "scripts"]
relative_files = true
# Ohne Thread-Coverage zeigt Worker-Code eine falsch-niedrige Zahl (ServiceBay-Standard).
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
