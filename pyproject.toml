[project]
name = "foundry-chronicle"
version = "0.3.0"
description = "Sitzungsprotokolle für Tisch-Rollenspiel — eine Instanz pro Gruppe"
requires-python = ">=3.12"
# **Kein Flask, kein Jinja2, kein waitress mehr** (#231). Die Betreiber-Seite ist fort, und
# mit ihr der einzige Grund, ein Webrahmenwerk vorzuhalten: der Dienst ist ein Bot-Prozess.
# ``/healthz``, das Install-Gate der Box, bedient seit #228 ``chronicle.bot.healthz`` mit
# der Standardbibliothek. ``markupsafe`` bleibt — es steht hier für ``chronicle.search``,
# das Treffer hervorhebt, und nicht als Anhängsel von Jinja.
#
# **``werkzeug`` fehlt hier mit Absicht** (#259). Es kam als Anhängsel von Flask mit, und
# als Flask ging, ging es mit — das Abbild startete nicht mehr, weil zwei Module
# ``secure_filename`` importierten. Nachgetragen wurde deshalb nicht das Paket, sondern
# die Funktion: ``chronicle.dateiname`` macht dasselbe in vier Zeilen, und ein
# Bot-Prozess ohne WSGI-Fläche hält keinen Webrahmenwerk-Werkzeugkasten für eine
# Funktion vor. Wer hier etwas hinzufügt: es gibt zwei Tore, die das prüfen —
# ``tests/test_laufzeit_importe.py`` und der CI-Job »Laufzeit-Import«.
dependencies = [
    "markupsafe>=2.1",
    "requests>=2.31",
    "python-socketio[client]>=5.11",
]

[project.optional-dependencies]
# **Kein ``transcribe``-Extra mehr** (#216, Betreiber-Entscheidung 2026-08-18). Wir
# halten kein Whisper-Modell mehr vor: faster-whisper, ctranslate2, PyAV und onnxruntime
# — dreistellige Megabyte — sind aus dem Image raus, die Verschriftung macht
# ``solaris-whisper-batch`` auf seiner Karte. Übrig bleibt ein HTTP-Aufruf, und der
# braucht nur ``requests``, das ohnehin dasteht.
# Eigenes Extra für den Aufnahme-Bot: py-cord ist ein Gateway-Client mit Sprach-Anhang,
# den weder der Webdienst noch der nächtliche Stapel braucht. Audio zu empfangen ist von
# Discord nicht offiziell unterstützt — die Bruchstelle bleibt damit auf ein Extra und
# eine Datei begrenzt. py-cord belegt das Paket ``discord``; ein daneben installiertes
# discord.py schlägt sich mit ihm.
#
# **Das Extra ``[voice]`` wird von py-cord abgeholt, nicht von Hand nachgebaut.** Genau
# das war der Fehler davor: PyNaCl war abgeschrieben, ``davey`` fehlte — und ohne davey
# spricht py-cord Discords DAVE-Verschlüsselung nicht, meldet »voice will NOT be
# supported« und der Bot verbindet sich, ohne je etwas zu hören. ``davey`` steht daneben
# trotzdem namentlich, damit die Zeile sagt, worauf es ankommt.
#
# **Festgenagelt auf einen unveröffentlichten Commit — mit Absicht (#60).** Seit dem
# 2026-03-02 erzwingt Discord DAVE auf allen Sprachkanälen; sich davon abzumelden endet
# mit ``WebSocket closed with 4017``, Discord lehnt die Sprachverbindung dann ganz ab.
# In der veröffentlichten 2.8.1 entschlüsselt ``opus.py`` **nach** dem Dekodieren
# (``dave.decrypt`` auf schon dekodiertem PCM), der Dekoder sieht Rauschen und wirft
# ``OpusError: corrupted stream``; der Empfang stirbt daran und die Sitzung bekommt
# keine einzige Spur. Pycord-PR #3159 dreht die Reihenfolge um — entschlüsseln, dann
# dekodieren — ist aber offen und in keiner Veröffentlichung.
#
# **Woher der Stand kommt, und warum aus einem eigenen Fork (#152, Betreiber-Entscheidung
# 2026-08-12).** ``326b72ac`` ist der Kopf von Pycord-PR #3159 (``fix/voice-rec-2``, vom
# 2026-07-22) im Upstream ``Pycord-Development/pycord``. Gezogen wird er trotzdem aus
# ``mdopp/pycord``, Branch ``foundry-chronicle/dave-voice-recv-3159``: ein fremder offener
# PR-Branch kann gelöscht oder umgeschrieben werden, und dann scheitert der Image-Bau
# (#145). Genagelt wird weiterhin auf den **Commit**, nicht auf den Branchnamen — ein
# Branch bewegt sich, und ein Bau, der gestern ging und heute nicht mehr, kostet die
# nächste Runde ihre Aufnahme. Die README des Forks trägt dieselbe Herkunft, damit der
# Fork in drei Monaten kein Rätsel ist.
#
# **Ausstieg:** Pycord #3159 gemergt **und** in einer py-cord-Veröffentlichung enthalten →
# beide Zeilen zurück auf eine Versionsangabe, Fork löschen. Damit das auffällt, ohne dass
# jemand daran denken muss, fragt ``scripts/pruefe_pycord_ausstieg.py`` die Lage wöchentlich
# ab (``.github/workflows/pycord-ausstieg.yml``) und schlägt fehl, sobald sie kippt; der
# Beobachtungsposten bleibt #145. Im Testlauf wird nichts abgefragt — ein Test, der ans
# Netz geht, ist keiner.
discord = [
    "py-cord[voice] @ git+https://github.com/mdopp/pycord@326b72acc8d1d952ac002fe07ca65581cf5952bc",
    "davey>=0.1.6",
]
# py-cord gehört hier dazu, obwohl nur der Bot es braucht: der Regressionstest
# registriert unsere Senke gegen py-cords **echten** Empfangs-Router. Genau das haben die
# Attrappen nicht gesehen — zweimal hintereinander fiel erst auf der Box auf, dass wir
# das Protokoll der Bibliothek verfehlt hatten. Es ist reines Python plus zwei kleine
# Räder; die CI wird davon nicht schwer. Derselbe Fork und derselbe festgenagelte Commit
# wie oben — eine CI, die gegen eine andere Fassung prüft als das Image installiert, prüft
# die falsche.
#
# **Flask steht hier und nicht mehr oben** (#231). Es ist keine Abhängigkeit des Dienstes
# mehr — die Betreiber-Seite ist fort —, wohl aber der beiden **Attrappen fremder Server**:
# ``tests/mocks`` stellt ein Foundry und ein Ollama als echten WSGI-Server auf einen
# Wegwerf-Port, weil ein Funktions-Fake nur beweist, dass der Code sich selbst aufruft
# (siehe ``tests/mocks/__init__.py``). Was sie nachbilden, ist die Gegenstelle und nicht
# unsere eigene Oberfläche; ins Image kommt es nicht, denn das installiert
# ``.[discord]``.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pyyaml>=6.0",
    "flask>=3.0",
    "py-cord[voice] @ git+https://github.com/mdopp/pycord@326b72acc8d1d952ac002fe07ca65581cf5952bc",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronicle = ["schema.sql", "suchindex.sql"]
# Die eingebaute Testwelt gehört ins Image: ohne sie fiele die Quelle »Testwelt« auf der
# Box auf eine fehlende Datei zurück, obwohl ``/setup`` sie anbietet.
"chronicle.foundry" = ["testwelt.json"]

[tool.ruff]
line-length = 100
# Der Autoloop-Skill ist eingespielte Fremdmechanik, keine Projektquelle.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/chronicle", "scripts"]
relative_files = true
# Ohne Thread-Coverage zeigt Worker-Code eine falsch-niedrige Zahl (ServiceBay-Standard).
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
