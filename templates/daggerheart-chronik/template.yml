apiVersion: v1
kind: Pod
metadata:
  name: daggerheart-chronik
  labels:
    app: daggerheart-chronik
  annotations:
    servicebay.label: "Daggerheart-Chronik"
    servicebay.schema-version: "1"
    servicebay.ports: "{{CHRONICLE_PORT}}/tcp"
    # nginx liefert den Proxy-Host, auth die Authelia-Forward-Auth davor. Beide müssen
    # stehen, bevor dieser Dienst installiert wird — sonst zeigt die Subdomain ins Leere.
    # Die Schrumpfung mit #157 nimmt ``auth`` nicht heraus, und #230 auch nicht: der
    # Bot-Token liegt zwar nicht mehr hinter dieser Seite, aber sie steht weiter auf einer
    # Subdomain und entscheidet, wer sie selbst öffnen darf. ADR 0001 gilt für sie also
    # unverändert.
    servicebay.dependencies: "nginx,auth"
    # Install-Gate der Box: /healthz antwortet 200, sobald der Prozess steht. Seit #228
    # bedient es der **Bot** und nicht mehr die Betreiber-Seite — er ist der Prozess, der
    # bleibt, wenn die Seite mit #227 fällt. Sein Port ist ein anderer als der der Seite,
    # weil beide im selben Netz-Namensraum liegen, und er hört **nur auf der Schleife**:
    # der Poller läuft auf dieser Box, im LAN hat das Gate nichts zu suchen (#190).
    # Deshalb steht CHRONICLE_HEALTH_PORT auch nicht in servicebay.ports — dort stehen
    # die veröffentlichten Ports, und dieser ist keiner.
    servicebay.healthcheck: |
      url: http://localhost:{{CHRONICLE_HEALTH_PORT}}/healthz
      interval: 30s
      timeout: 5s
      startup_timeout: 5m
spec:
  # **Erklärte Abweichung von ServiceBay-ADR 0007** (#165), die App-Container in einen
  # eigenen Netz-Namensraum stellen will. Grund: der Dienst spricht die Nachbarn dieser
  # Box über die Schleife an — Ollama auf 127.0.0.1:11434 schreibt die Chronik,
  # solaris-tts auf 127.0.0.1:8881 spricht die Ansage —, und der Proxy findet ihn so ohne
  # veröffentlichten hostPort. Beide binden heute nur an Loopback, aus einer isolierten
  # netns wären sie unerreichbar. ADR 0007 sieht benannte Ausnahmen vor;
  # mdopp/servicebay#2518 hat verneint, die Liste bleibt geschlossen.
  # Der Preis ist belegt, nicht vermutet: hostNetwork ist der Grund, warum dieser Port auf
  # 0.0.0.0 im ganzen LAN stand, und ein erfundener Remote-User genügte, um an den
  # Bot-Token zu kommen (#190). Bezahlt wird er von chronicle.herkunft — geglaubt werden
  # die Anmelde-Kopfzeilen nur von einer Adresse dieser Maschine (siehe unten bei
  # CHRONICLE_REQUIRE_REMOTE_USER). Seit #230 liegt hinter der Seite ohnehin kein
  # Geheimnis mehr; das ist der zweite Riegel und nicht der Ersatz für den ersten.
  # Die Abweichung fällt, sobald die Nachbarn auch aus einem eigenen Netz-Namensraum
  # erreichbar sind. Das liegt in deren Vorlagen, nicht hier — und eine Netzänderung an
  # diesem Dienst wird ohne Box-Verify nicht gemacht: falsch gemacht legt sie eine echte
  # Discord-Gilde still.
  hostNetwork: true
  # **OnFailure statt der Vorgabe Always.** Podman startet einen Container sonst auch
  # dann neu, wenn er sich mit 0 beendet hat — und genau das ist der Bot, wenn ihm eine
  # Freigabe im Discord-Portal fehlt oder sein Token abgelehnt wird. Beides heilt kein
  # Neustart; wiederholt wird daraus in Minuten ein tausendfacher Anmeldeversuch. Am
  # 2026-08-10 hat Discord deswegen den Token zurückgesetzt. Der Bot endet in diesen
  # Fällen bewusst mit 0 (``chronicle.bot.BotHaelt``) — diese Zeile ist die andere
  # Hälfte der Abmachung: 0 heißt liegen lassen.
  # Seit #228 hängt am Bot außerdem das Install-Gate, und dann bleibt er in genau diesen
  # Fällen liegen, **ohne** sich zu beenden: ein fehlender Token ist bei der
  # Erstinstallation der Normalfall, und ein beendeter Container ließe den Poller ins
  # Leere greifen. Verbunden wird trotzdem nichts mehr. Für alles andere — einen echten
  # Absturz — gilt OnFailure unverändert.
  restartPolicy: OnFailure
  containers:
  # Hinter dem Proxy-Host liegt seit #157 keine Anwendung mehr, sondern **eine Seite**:
  # /einstellungen für die Verwaltungsgruppe — den einen Wert, der hier seit #230 noch
  # gepflegt wird —, /status als Altweg dorthin, / als Weiterleitung und /healthz als
  # Install-Gate. Alles Spielbare ist ein Discord-Befehl, und der nächtliche Lauf hängt
  # seit #229 am Bot daneben.
  - name: chronik
    image: ghcr.io/mdopp/foundry-chronicle:{{CHRONICLE_IMAGE_TAG}}
    # Container-uid 0 ist unter rootless Podman der unprivilegierte Host-Benutzer, dem
    # {{DATA_DIR}} gehört; ohne das scheitert das Anlegen der SQLite-Datei mit EPERM.
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    env:
      - name: CHRONICLE_HOST
        value: "0.0.0.0"
      - name: CHRONICLE_PORT
        value: "{{CHRONICLE_PORT}}"
      - name: CHRONICLE_DATA_DIR
        value: "/data"
      - name: CHRONICLE_RECORDINGS_DIR
        value: "/aufnahmen"
      # Die Haustür steht am Proxy (ADR 0001). Ohne Remote-User antwortet der Dienst 403.
      # Seit #190 reicht die Kopfzeile allein nicht: der Port liegt im Host-Netz offen,
      # und wer ihn erreicht, schreibt sie sich selbst hin. Geglaubt wird sie — und
      # Remote-Groups mit ihr — nur von einem Absender, der eine Adresse **dieser
      # Maschine** trägt; genau das tut der Proxy, der hier daneben läuft. Steht er
      # einmal woanders, trägt CHRONICLE_TRUSTED_PROXIES seine Adresse nach (siehe
      # README »Wenn die Seite 403 sagt, obwohl die Anmeldung geklappt hat«).
      - name: CHRONICLE_REQUIRE_REMOTE_USER
        value: "1"
      # Den *Wert* liest seit #157 niemand mehr — die Protokollseite, auf die er zeigte,
      # ist fort. Die Zeile bleibt trotzdem stehen, denn irgendwo im Manifest muss
      # {{PUBLIC_DOMAIN}} vorkommen: sonst injiziert der Assembler die Variable nicht und
      # der Proxy-Host wird still übersprungen — Assist
      # footgun-subdomain-needs-public-domain.
      - name: CHRONICLE_PUBLIC_URL
        value: "https://{{CHRONICLE_SUBDOMAIN}}.{{PUBLIC_DOMAIN}}"
      # Ollama gehört der Instanz und kommt seit #230 aus der Umgebung — hier, weil auch
      # ein Stapellauf aus diesem Container (``python -m chronicle.compose``) formulieren
      # können muss. Leer heißt: das Ollama dieser Box, ``chronicle.config`` setzt es ein.
      - name: OLLAMA_URL
        value: "{{OLLAMA_URL}}"
      - name: OLLAMA_MODEL
        value: "{{OLLAMA_MODEL}}"
      # **DISCORD_BOT_TOKEN steht hier absichtlich nicht.** Ihn braucht der Bot daneben,
      # und nur er; diese Seite zeigt seit #230 nicht einmal mehr an, ob er gesetzt ist.
      # Was ein Prozess nicht bekommt, kann er auch nicht in eine Logzeile schreiben.
      # Der Foundry-Zugang steht ebenfalls nicht hier: den pflegt die Gruppe selbst in
      # Discord unter /setup, er gehört ihrer Runde und nicht der Instanz.
    ports:
      - containerPort: {{CHRONICLE_PORT}}
    # **Hier steht absichtlich keine Karten-Durchreichung.** ``podman kube play`` (5.8.2)
    # verwirft ``resources.limits`` für eine Pod-Spezifikation still — kein Fehler, kein
    # Hinweis, der Pod startet ohne Karte. Gemessen am 2026-08-12 im Container:
    # ``cuda_verfuegbar() -> False`` und kein ``nvidia-*``-Knoten unter ``/dev``, während
    # der Nachbar ollama seine hat (ServiceBay #1026/#2174, unser Fall als
    # mdopp/servicebay#2517). Der bekannte Fix ist ein einzelnes ``.container``-Quadlet
    # mit ``AddDevice=`` plus ``SecurityLabelDisable=true``; den gibt es für einen Pod aus
    # zwei Containern, die sich ``/data`` teilen, nicht. **Seit #216 braucht dieser Pod
    # auch keine:** er hält kein Whisper-Modell mehr. Verschriftet wird bei
    # ``solaris-whisper-batch`` auf der Karte der Box (mdopp/solarisbay#1161), erreicht
    # über die Schleife wie Ollama und solaris-tts auch — Vorgabe ``127.0.0.1:10301``,
    # überschreibbar mit ``CHRONICLE_WHISPER_URL``. Einen CPU-Rückfall gibt es dafür
    # **nicht** mehr: ist der Dienst aus, bleibt die Spur liegen und der Nachtlauf sagt
    # es, statt eine Chronik ohne das gesprochene Wort zu schreiben.
    volumeMounts:
      - mountPath: /data
        name: chronik-daten
      - mountPath: /aufnahmen
        name: chronik-aufnahmen
  # Der Aufnahme-Bot ist ein eigener, dauerhafter Prozess: er hält eine
  # Gateway-Verbindung, weil Sprache nur mitgeschnitten werden kann, während sie
  # gesprochen wird. Gleiches Image, anderer Befehl. Den Token bekommt er seit #230 aus
  # seiner eigenen Umgebung und nicht mehr aus der SQLite; /data teilen beide trotzdem,
  # denn dort liegt die Chronik. Ohne Token beendet er sich mit einem Satz, statt in einer
  # Schleife abzustürzen.
  # Seit #229 trägt derselbe Prozess außerdem den nächtlichen Lauf: er sieht in einem
  # Faden neben der Gateway-Verbindung auf die Uhr, und der Lauf selbst bekommt noch
  # einen daneben — auf der Ereignisschleife läge sonst der Herzschlag zu Discord still.
  - name: bot
    image: ghcr.io/mdopp/foundry-chronicle:{{CHRONICLE_IMAGE_TAG}}
    command: ["python", "-m", "chronicle.bot"]
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    env:
      - name: CHRONICLE_DATA_DIR
        value: "/data"
      - name: CHRONICLE_RECORDINGS_DIR
        value: "/aufnahmen"
      # Das Install-Gate der Box (#228). Gebunden wird 127.0.0.1 und sonst nichts — eine
      # Variable für die Adresse gibt es nicht, weil es dafür keinen richtigen zweiten
      # Wert gäbe: der Pod liegt im Host-Netz, 0.0.0.0 stünde im ganzen LAN offen.
      # Deshalb kein containerPort und kein Eintrag in servicebay.ports.
      - name: CHRONICLE_HEALTH_PORT
        value: "{{CHRONICLE_HEALTH_PORT}}"
      # Seit #230 kommt der Token aus der Umgebung und nicht mehr aus der SQLite. Er steht
      # nur bei diesem Container: der Bot meldet sich damit an, sonst braucht ihn niemand.
      # Bewusst 'type: text' und kein 'secret' — der Assistent würfelte für ein Geheimnis
      # einen Wert aus, und ein ausgewürfelter Bot-Token meldete sich bei Discord an und
      # wurde abgelehnt (#33). Leer heißt hier ehrlich »nicht gesetzt«: der Bot sagt einen
      # Satz und bleibt liegen, statt es mit einem falschen Wert zu versuchen.
      - name: DISCORD_BOT_TOKEN
        value: "{{DISCORD_BOT_TOKEN}}"
      # Der nächtliche Lauf hängt seit #229 an diesem Prozess, und er formuliert.
      - name: OLLAMA_URL
        value: "{{OLLAMA_URL}}"
      - name: OLLAMA_MODEL
        value: "{{OLLAMA_MODEL}}"
    volumeMounts:
      - mountPath: /data
        name: chronik-daten
      - mountPath: /aufnahmen
        name: chronik-aufnahmen
  volumes:
  # Die SQLite-Datei liegt hier und läuft im WAL-Modus; sie ist klein und enthält alles
  # Unersetzliche. Audiospuren daneben gehören nicht ins Backup.
  - name: chronik-daten
    hostPath:
      path: {{DATA_DIR}}/daggerheart
      type: DirectoryOrCreate
  # Neben dem Datenverzeichnis und nicht darin — das ist die Entscheidung zu #27.
  # ServiceBay sichert je Dienst eine Auswahlliste, verankert am Verzeichnis
  # {{DATA_DIR}}/<dienst>: was daneben liegt, kann eine spätere Liste gar nicht erst
  # einsammeln, ein Unterverzeichnis müsste sie ausdrücklich aussparen. Unterhalb von
  # {{DATA_DIR}} bleibt es trotzdem, weil ein absoluter Host-Pfad aus der
  # Abdeckungsprüfung der Plattform herausfällt — dann wäre es unsichtbar statt
  # ausgenommen. DirectoryOrCreate, weil das Verzeichnis bei der Erstinstallation noch
  # nicht existiert; mit Directory scheitert der erste Start.
  - name: chronik-aufnahmen
    hostPath:
      path: {{DATA_DIR}}/daggerheart-aufnahmen
      type: DirectoryOrCreate
