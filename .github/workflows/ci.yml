name: CI

on:
  pull_request:
  push:
    branches: [main]

# gitleaks und der Pfadfilter fragen die Dateien des Pull-Requests über die API ab;
# ohne pull-requests:read antwortet GitHub mit 403.
permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Geheimnisse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    name: Commit-Subjects
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_commit_subjects.py "origin/${{ github.base_ref }}..HEAD"

  pfade:
    name: Geänderte Pfade
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - '**/*.sql'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    needs: pfade
    if: needs.pfade.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests und Diff-Coverage
    needs: pfade
    if: needs.pfade.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Kein transcribe-Extra mehr: seit #216 lädt dieses Projekt kein Whisper-Modell und
      # dekodiert kein Audio — die Verschriftung ist ein HTTP-Aufruf gegen
      # ``solaris-whisper-batch``, und dessen Gegenstelle steht im Test als Attrappe.
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov --cov-report=xml
      - name: Diff-Coverage
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_diff_coverage.py --base "origin/${{ github.base_ref }}"

  # Der Job, der am 2026-08-23 gefehlt hat (#259). Alle anderen laufen gegen ``.[dev]``
  # und sahen deshalb ein werkzeug, das im Abbild nie stand; 1469 grüne Tests, und der
  # Bot kam auf der Box nicht bis zur Gateway-Verbindung. Hier wird **derselbe Befehl
  # wie im Dockerfile** ausgeführt — ``.[discord]``, ohne dev-Extra, nicht editierbar —
  # und dann importiert. Was hier grün ist, importiert auch im Container.
  laufzeit:
    name: Laufzeit-Import
    needs: pfade
    if: needs.pfade.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # libopus0 wie im Abbild: py-cord bringt nur die Bindung mit, und ohne die
      # Bibliothek scheitert schon der Import von ``discord``.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus0
      - run: pip install ".[discord]"
      - run: python3 scripts/pruefe_laufzeit_importe.py
