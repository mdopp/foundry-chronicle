name: build-images

# Baut das Dienst-Image und veröffentlicht es nach GHCR — aber erst hinter grünen Tests.
# Der Publish-Job hängt deshalb an `needs: test`; eine CI, die nur baut, ist nach dem
# ServiceBay-Standard non-compliant.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
  push:
    branches: [main]
    # Muss denselben Eingabesatz abdecken wie der Pull-Request-Filter darüber — GitHub
    # Actions kennt keine YAML-Anker, die Liste steht deshalb zweimal da. Läuft sie hier
    # auf einem kleineren Satz, überspringt der PR einen Bruch, der erst nach dem Merge
    # auffiele.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
  # Kein `tags: ['v*']` hier (#309). Ein Release-Tag käme auf diesem Weg aus zwei
  # unabhängigen Gründen nie an: der `paths`-Filter oben gilt für den ganzen `push`-Block
  # und damit auch für Tag-Pushes, und release-please schneidet den Tag mit dem
  # `GITHUB_TOKEN` — von diesem Token ausgelöste Ereignisse starten laut GitHub
  # ausdrücklich keinen neuen Lauf. Der Release-Bau kommt deshalb als `workflow_call`
  # aus `release-please.yml`, direkt aus dem Lauf, der den Tag gesetzt hat.
  workflow_call:
    inputs:
      release_tag:
        description: 'Der geschnittene Tag, z. B. v0.3.1 — leer heißt: kein Versions-Tag.'
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Derselbe Eingabesatz wie im Test-Job der ci.yml. Ein Torwächter, der eine andere
      # Installation prüft als die CI, lässt das Image an einem Bruch vorbei, den die CI
      # nebenan gerade rot meldet. Kein transcribe-Extra mehr: seit #216 lädt dieses
      # Projekt kein Whisper-Modell und dekodiert kein Audio.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<kurz> ist der feste Tag für den Rollout; :latest zeigt auf main. Der
          # Versions-Tag kommt aus `release_tag`, nicht aus `github.ref`: beim Aufruf aus
          # release-please.yml zeigt der Ref auf `main`, der Tag steht nur im Input
          # (#309). Erzeugt wird die Versionsnummer **ohne** führendes `v` — aus
          # `v0.3.1` wird `0.3.1`, plus `0.3`. Genau so steht es in der Template-Doku.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=foundry-chronicle
            org.opencontainers.image.description=Sitzungsprotokolle für Tisch-Rollenspiel — eine Instanz pro Gruppe
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Bauen und auf main veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
