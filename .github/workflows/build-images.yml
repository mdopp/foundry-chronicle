name: build-images

# Baut das Dienst-Image und veröffentlicht es nach GHCR — aber erst hinter grünen Tests.
# Der Publish-Job hängt deshalb an `needs: test`; eine CI, die nur baut, ist nach dem
# ServiceBay-Standard non-compliant.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
  push:
    branches: [main]
    tags: ['v*']
    # Muss denselben Eingabesatz abdecken wie der Pull-Request-Filter darüber — GitHub
    # Actions kennt keine YAML-Anker, die Liste steht deshalb zweimal da. Läuft sie hier
    # auf einem kleineren Satz, überspringt der PR einen Bruch, der erst nach dem Merge
    # auffiele.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Derselbe Eingabesatz wie im Test-Job der ci.yml. Ein Torwächter, der eine andere
      # Installation prüft als die CI, lässt das Image an einem Bruch vorbei, den die CI
      # nebenan gerade rot meldet. Kein transcribe-Extra mehr: seit #216 lädt dieses
      # Projekt kein Whisper-Modell und dekodiert kein Audio.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<kurz> ist der feste Tag für den Rollout; :latest zeigt auf main. Sobald
          # release-please ein v-Tag schneidet, entsteht daraus zusätzlich der
          # Versions-Tag, auf den das Template dann gepinnt wird.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=foundry-chronicle
            org.opencontainers.image.description=Sitzungsprotokolle für Tisch-Rollenspiel — eine Instanz pro Gruppe
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Bauen und auf main veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
