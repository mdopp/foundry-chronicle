name: release-please

on:
  push:
    branches: [main]

# Zwei Laeufe duerfen sich nicht ueberholen (#355). Am 2026-09-07 wurden sechs
# Releases in schneller Folge geschnitten; ein Release-PR wurde gemergt, waehrend
# der naechste Push den naechsten Lauf schon angestossen hatte. Der fand den ihm
# bekannten PR gemergt vor, wollte ihn wiederbeleben und scheiterte an
# "state cannot be changed" -- zwanzig Sekunden spaeter stand ein Doppelgaenger-PR
# fuer eine bereits veroeffentlichte Version da, den release-please nicht mehr
# abraeumt.
#
# `cancel-in-progress: false` ist hier die richtige Haelfte der Sperre: Laeufe
# sollen sich anstellen, nicht einander abbrechen. Ein abgebrochener Lauf koennte
# einen Tag setzen und den Release-Bau danach nicht mehr starten.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Der Release-Bau hängt hier und nicht an einem Tag-Push (#309): den Tag setzt
  # release-please mit dem `GITHUB_TOKEN`, und ein davon ausgelöstes Ereignis startet
  # laut GitHub keinen neuen Lauf. Gebaut wird deshalb im selben Lauf, der den Tag
  # gesetzt hat — mit dem Tag als Eingabe, weil der Ref hier auf `main` zeigt.
  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
